<!-- Pinnacle Holdings "Get My Cash Offer" multi-step form.
     Drop this entire block inside a Gutenberg Custom HTML block.
     Self-contained: no external scripts, no external fonts.
     Posts to /agents/pinnacle_public.php (same origin).
-->
<div id="pnf-root">
  <div class="pnf-top">
    <div class="pnf-lang" role="group" aria-label="Language">
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="es">ES</button>
    </div>
    <div class="pnf-progress" aria-hidden="true"><div class="pnf-progress-bar" id="pnf-progress-bar"></div></div>
    <span class="pnf-step-count" id="pnf-step-count"></span>
  </div>
  <div class="pnf-stage" id="pnf-stage" aria-live="polite"></div>
</div>

<style>
/* Pinnacle Holdings "Get My Cash Offer" multi-step form
   Brand: #0D3B2E dark green, #C9A84C gold, #FFFFFF white
   Scoped to #pnf-root to avoid Astra theme bleed */

#pnf-root { --pnf-green:#0D3B2E; --pnf-green-2:#1A4E3C; --pnf-gold:#C9A84C; --pnf-gold-2:#B7933F; --pnf-bg:#F5F0E8; --pnf-text:#FFFFFF; --pnf-ink:#0D3B2E; --pnf-muted:#8A8A8A; --pnf-error:#E04B3A; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; color:var(--pnf-ink); background:linear-gradient(135deg,#0D3B2E 0%,#1A4E3C 50%,#0D3B2E 100%); min-height:600px; padding:24px 16px; box-sizing:border-box; position:relative; overflow:hidden; }
#pnf-root *, #pnf-root *:before, #pnf-root *:after { box-sizing:border-box; }

/* TOP BAR: lang toggle + progress */
#pnf-root .pnf-top { display:flex; align-items:center; justify-content:space-between; max-width:640px; margin:0 auto 24px; gap:12px; }
#pnf-root .pnf-lang { display:flex; gap:0; border:1px solid rgba(201,168,76,.4); border-radius:999px; overflow:hidden; background:rgba(255,255,255,.08); }
#pnf-root .pnf-lang button { background:transparent; color:#F5F0E8; border:0; padding:6px 14px; font-size:13px; font-weight:600; cursor:pointer; letter-spacing:.5px; }
#pnf-root .pnf-lang button.is-active { background:var(--pnf-gold); color:var(--pnf-green); }
#pnf-root .pnf-progress { flex:1; max-width:320px; height:6px; background:rgba(255,255,255,.15); border-radius:999px; overflow:hidden; }
#pnf-root .pnf-progress-bar { height:100%; background:var(--pnf-gold); border-radius:999px; transition:width .35s ease; width:0%; }
#pnf-root .pnf-step-count { color:#F5F0E8; font-size:12px; font-weight:500; opacity:.85; white-space:nowrap; }

/* STAGE — screen container */
#pnf-root .pnf-stage { max-width:640px; margin:0 auto; background:#FFFFFF; border-radius:20px; box-shadow:0 20px 60px rgba(0,0,0,.25); padding:40px 28px 32px; position:relative; min-height:420px; display:flex; flex-direction:column; }
#pnf-root .pnf-screen { display:none; flex:1; flex-direction:column; }
#pnf-root .pnf-screen.is-active { display:flex; animation:pnfFade .35s ease; }
@keyframes pnfFade { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }

/* HEADINGS */
#pnf-root .pnf-eyebrow { color:var(--pnf-gold-2); font-size:12px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; margin:0 0 8px; }
#pnf-root .pnf-question { color:var(--pnf-ink); font-size:26px; line-height:1.2; font-weight:700; margin:0 0 8px; letter-spacing:-0.02em; }
#pnf-root .pnf-hint { color:var(--pnf-muted); font-size:15px; line-height:1.5; margin:0 0 24px; }

/* CLICK CARDS (big clickable buttons) */
#pnf-root .pnf-cards { display:grid; gap:10px; margin-top:8px; }
#pnf-root .pnf-card { background:#FFFFFF; border:2px solid #E5DFD4; border-radius:12px; padding:16px 18px; text-align:left; cursor:pointer; font-size:16px; font-weight:600; color:var(--pnf-ink); transition:all .15s ease; display:flex; align-items:center; gap:12px; width:100%; }
#pnf-root .pnf-card:hover, #pnf-root .pnf-card:focus-visible { border-color:var(--pnf-gold); background:#FAF7EF; outline:none; transform:translateX(2px); }
#pnf-root .pnf-card.is-selected { border-color:var(--pnf-green); background:var(--pnf-green); color:#FFFFFF; }
#pnf-root .pnf-card .pnf-emoji { font-size:22px; line-height:1; }
#pnf-root .pnf-card .pnf-sub { display:block; font-size:13px; font-weight:400; color:var(--pnf-muted); margin-top:2px; }
#pnf-root .pnf-card.is-selected .pnf-sub { color:rgba(255,255,255,.8); }

/* BUTTON ROW (numeric choices like beds/baths) */
#pnf-root .pnf-row { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
#pnf-root .pnf-chip { min-width:64px; padding:14px 16px; border:2px solid #E5DFD4; border-radius:10px; background:#FFFFFF; font-weight:700; font-size:17px; color:var(--pnf-ink); cursor:pointer; transition:all .15s ease; }
#pnf-root .pnf-chip:hover, #pnf-root .pnf-chip:focus-visible { border-color:var(--pnf-gold); background:#FAF7EF; outline:none; }
#pnf-root .pnf-chip.is-selected { border-color:var(--pnf-green); background:var(--pnf-green); color:#FFFFFF; }

/* INPUTS */
#pnf-root .pnf-input, #pnf-root .pnf-textarea { width:100%; padding:14px 16px; border:2px solid #E5DFD4; border-radius:10px; font-size:17px; font-family:inherit; color:var(--pnf-ink); background:#FFFFFF; transition:border-color .15s ease; }
#pnf-root .pnf-input:focus, #pnf-root .pnf-textarea:focus { outline:none; border-color:var(--pnf-gold); }
#pnf-root .pnf-textarea { resize:vertical; min-height:100px; }
#pnf-root .pnf-input-row { display:flex; gap:10px; align-items:stretch; }
#pnf-root .pnf-input-row .pnf-prefix { padding:14px 14px; background:#F5F0E8; border:2px solid #E5DFD4; border-right:0; border-radius:10px 0 0 10px; font-weight:600; color:var(--pnf-muted); }
#pnf-root .pnf-input-row .pnf-input { border-radius:0 10px 10px 0; }
#pnf-root .pnf-error-msg { color:var(--pnf-error); font-size:13px; margin-top:8px; min-height:18px; }

/* SUGGESTIONS (address autocomplete) */

#pnf-root .pnf-back { background:transparent; border:0; color:var(--pnf-muted); font-size:14px; font-weight:600; cursor:pointer; padding:8px 12px; display:flex; align-items:center; gap:6px; }
#pnf-root .pnf-back:hover { color:var(--pnf-ink); }

#pnf-root .pnf-next { background:var(--pnf-gold); color:var(--pnf-green); border:0; padding:14px 28px; border-radius:999px; font-size:16px; font-weight:700; cursor:pointer; letter-spacing:.3px; transition:transform .15s ease, background .15s ease; }
#pnf-root .pnf-next:hover:not(:disabled) { background:var(--pnf-gold-2); transform:translateX(2px); }
#pnf-root .pnf-next:disabled { opacity:.45; cursor:not-allowed; }
#pnf-root .pnf-skip { background:transparent; border:0; color:var(--pnf-muted); font-size:13px; cursor:pointer; text-decoration:underline; }

/* SMS code input */
#pnf-root .pnf-code-boxes { display:flex; gap:8px; justify-content:center; margin:16px 0 12px; }
#pnf-root .pnf-code-boxes input { width:48px; height:56px; text-align:center; font-size:24px; font-weight:700; border:2px solid #E5DFD4; border-radius:10px; background:#FFFFFF; }
#pnf-root .pnf-code-boxes input:focus { outline:none; border-color:var(--pnf-gold); }
#pnf-root .pnf-resend { color:var(--pnf-green); font-size:13px; font-weight:600; background:none; border:0; cursor:pointer; text-decoration:underline; margin-top:4px; }
#pnf-root .pnf-resend:disabled { color:var(--pnf-muted); cursor:not-allowed; text-decoration:none; }

/* SUCCESS SCREEN */
#pnf-root .pnf-success { text-align:center; padding:24px 12px; }
#pnf-root .pnf-success-icon { width:72px; height:72px; margin:0 auto 16px; background:var(--pnf-green); color:var(--pnf-gold); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:38px; }
#pnf-root .pnf-success h2 { font-size:28px; color:var(--pnf-ink); margin:0 0 12px; }
#pnf-root .pnf-success p { color:var(--pnf-muted); font-size:16px; line-height:1.5; margin:0 0 20px; }
#pnf-root .pnf-success .pnf-score { display:inline-block; padding:8px 18px; background:var(--pnf-gold); color:var(--pnf-green); border-radius:999px; font-weight:700; font-size:14px; letter-spacing:.5px; }

/* HONEYPOT (hidden anti-bot) */
#pnf-root .pnf-hp { position:absolute !important; left:-10000px !important; top:auto !important; width:1px !important; height:1px !important; overflow:hidden !important; }

/* SPINNER */
#pnf-root .pnf-spinner { width:18px; height:18px; border:2.5px solid rgba(255,255,255,.3); border-top-color:#FFFFFF; border-radius:50%; animation:pnfSpin .7s linear infinite; display:inline-block; vertical-align:middle; margin-left:8px; }

/* MOBILE */
@media (max-width:520px){

  #pnf-root .pnf-code-boxes input { width:40px; height:50px; font-size:20px; }
  #pnf-root .pnf-top { margin-bottom:16px; }
}

</style>

<script>
/* Pinnacle Form — core state machine + API.
   Endpoint: same-origin /agents/pinnacle_public.php
   Depends on window.PNF_I18N (loaded first). */
(function(){
  "use strict";
  var API  = "/agents/pinnacle_public.php";
  var T    = window.PNF_I18N;
  var ORDER = ["s1","s2","s3","s4","s5","s6","s7","s8","s9","s10","s11","s12","s13","s14","s15","s16","s17","ok"];
  var STEP_TOTAL = ORDER.length - 1;       // "ok" is not a step in the counter

  var state = {
    lang: (navigator.language||"en").toLowerCase().indexOf("es")===0 ? "es" : "en",
    pageLoadedAt: Date.now(),
    history: [],                            // for Back button
    current: "s1",
    data: {                                 // collected answers
      address:"", place_id:"", city:"", state:"WI", zip:"",
      property_type:"",
      name:"", email:"", phone_raw:"",
      lead_id:"", session_token:"",
      condition:"", roof:"", beds:"", baths:"", occupancy:"", issues:"",
      timeline:"", priority:"", asking_price:"", payment_pref:"", amount_owed:""
    },
    resendTimer: null,
    submitting: false
  };
  window.PNF_STATE = state;                 // exposed for screens module + debug

  function t(key, vars){
    var s = (T[state.lang] && T[state.lang][key]) || T.en[key] || key;
    if (vars) Object.keys(vars).forEach(function(k){ s = s.replace("{"+k+"}", vars[k]); });
    return s;
  }
  window.PNF_T = t;

  function $(sel, root){ return (root||document).querySelector(sel); }
  function $all(sel, root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); }
  window.PNF_$ = $; window.PNF_$$ = $all;

  // ---- API helpers ----
  function api(action, body){
    var payload = Object.assign({ action: action }, body||{});
    return fetch(API, {
      method: "POST",
      headers: { "Content-Type":"application/json" },
      body: JSON.stringify(payload)
    }).then(function(r){ return r.json().then(function(j){ j.__http = r.status; return j; }); });
  }
  window.PNF_API = api;

  // ---- Rendering ----
  function renderProgress(){
    var idx = ORDER.indexOf(state.current);
    if (state.current === "ok") { $("#pnf-progress-bar").style.width = "100%"; $("#pnf-step-count").textContent = ""; return; }
    var pct = Math.round(((idx+1)/STEP_TOTAL)*100);
    $("#pnf-progress-bar").style.width = pct + "%";
    $("#pnf-step-count").textContent = t("step_of",{n:idx+1,t:STEP_TOTAL});
  }

  function show(id){
    $all("#pnf-root .pnf-screen").forEach(function(el){ el.classList.remove("is-active"); });
    var next = $("#pnf-screen-"+id);
    if (!next) { console.warn("PNF: screen not found",id); return; }
    next.classList.add("is-active");
    state.current = id;
    renderProgress();
    // back button visibility
    var back = $("#pnf-screen-"+id+" .pnf-back");
    if (back) back.hidden = (state.history.length === 0);
    // focus first input for keyboard users
    var f = next.querySelector("input, textarea, button.pnf-card, button.pnf-chip");
    if (f) setTimeout(function(){ try { f.focus(); } catch(e){} }, 60);
  }

  function goTo(id){
    if (state.current !== id) state.history.push(state.current);
    show(id);
  }
  function goBack(){
    var prev = state.history.pop();
    if (prev) show(prev);
  }
  window.PNF_GO = goTo; window.PNF_BACK = goBack;

  // ---- Validation ----
  function validEmail(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v); }
  function validPhone(v){ return (v.replace(/\D/g,"").length >= 10); }
  window.PNF_VALID = { email: validEmail, phone: validPhone };

  // ---- Language toggle ----
  function setLang(lang){
    state.lang = lang;
    $all("#pnf-root .pnf-lang button").forEach(function(b){
      b.classList.toggle("is-active", b.getAttribute("data-lang") === lang);
    });
    // re-render current screen (screens module re-reads i18n on render)
    if (window.PNF_SCREENS && window.PNF_SCREENS.rerender) window.PNF_SCREENS.rerender();
    renderProgress();
  }
  window.PNF_SETLANG = setLang;

  // ---- Resend timer for SMS ----
  function startResendTimer(btn, seconds){
    var remaining = seconds;
    btn.disabled = true;
    btn.textContent = t("resend_in",{s:remaining});
    if (state.resendTimer) clearInterval(state.resendTimer);
    state.resendTimer = setInterval(function(){
      remaining--;
      if (remaining <= 0){
        clearInterval(state.resendTimer);
        btn.disabled = false;
        btn.textContent = t("resend");
      } else {
        btn.textContent = t("resend_in",{s:remaining});
      }
    }, 1000);
  }
  window.PNF_TIMER = startResendTimer;

  // ---- Error display helper ----
  function setError(screenId, msg){
    var el = $("#pnf-screen-"+screenId+" .pnf-error-msg");
    if (el) el.textContent = msg || "";
  }
  window.PNF_ERR = setError;

  // ---- Submit finale ----
  function submitFinal(){
    if (state.submitting) return;
    state.submitting = true;
    api("update_lead", {
      lead_id: state.data.lead_id,
      session_token: state.data.session_token,
      phase2: { condition: state.data.condition, roof: state.data.roof, beds: state.data.beds, baths: state.data.baths, occupancy: state.data.occupancy, issues: state.data.issues },
      phase3: { timeline: state.data.timeline, priority: state.data.priority, asking_price: state.data.asking_price, payment_pref: state.data.payment_pref, amount_owed: state.data.amount_owed }
    }).then(function(resp){
      state.submitting = false;
      if (resp && resp.ok){
        state.data.score = resp.score;
        state.data.heat = resp.heat;
        goTo("ok");
      } else {
        alert((resp && resp.error) || t("err_generic"));
      }
    }).catch(function(){ state.submitting = false; alert(t("err_generic")); });
  }
  window.PNF_SUBMIT = submitFinal;

  // ---- Boot ----
  document.addEventListener("DOMContentLoaded", function(){
    // Lang buttons
    $all("#pnf-root .pnf-lang button").forEach(function(b){
      b.addEventListener("click", function(){ setLang(b.getAttribute("data-lang")); });
    });
    setLang(state.lang);
    // First screen
    show("s1");
  });
})();

</script>

<script>
/* Pinnacle Form — screens. Renders 18 screens into #pnf-stage.
   Depends on core (PNF_GO, PNF_T, PNF_STATE, PNF_API, PNF_VALID, PNF_$). */
(function(){
  "use strict";
  var t = window.PNF_T, go = window.PNF_GO, back = window.PNF_BACK, st = window.PNF_STATE;
  var $ = window.PNF_$, $$ = window.PNF_$$, api = window.PNF_API, V = window.PNF_VALID, setErr = window.PNF_ERR;

  // helpers
  function el(html){ var d = document.createElement("div"); d.innerHTML = html.trim(); return d.firstElementChild; }
  function navRow(hasSkip, onNext, nextKey){
    return '<div class="pnf-nav">'+
      '<button type="button" class="pnf-back">'+t("back")+'</button>'+
      (hasSkip ? '<button type="button" class="pnf-skip">'+t("skip")+'</button>' : '')+
      '<button type="button" class="pnf-next" disabled>'+t(nextKey||"next")+'</button>'+
    '</div>';
  }
  function wireNav(scr, onNext, onSkip){
    var b = scr.querySelector(".pnf-back"); if (b) b.addEventListener("click", back);
    var n = scr.querySelector(".pnf-next"); if (n) n.addEventListener("click", onNext);
    var s = scr.querySelector(".pnf-skip"); if (s && onSkip) s.addEventListener("click", onSkip);
  }
  function cardsHTML(opts){
    return '<div class="pnf-cards">' + opts.map(function(o){
      return '<button type="button" class="pnf-card" data-val="'+o.v+'">'+
        (o.emoji?'<span class="pnf-emoji">'+o.emoji+'</span>':'')+
        '<span><span>'+o.label+'</span>'+(o.sub?'<span class="pnf-sub">'+o.sub+'</span>':'')+'</span>'+
      '</button>';
    }).join("") + '</div>';
  }
  function chipsHTML(values){
    return '<div class="pnf-row">' + values.map(function(v){
      return '<button type="button" class="pnf-chip" data-val="'+v+'">'+v+'</button>';
    }).join("") + '</div>';
  }
  function header(scr, eyebrowKey, qKey, hintKey, vars){
    return (eyebrowKey?'<p class="pnf-eyebrow">'+t(eyebrowKey)+'</p>':'')+
      '<h2 class="pnf-question">'+t(qKey,vars)+'</h2>'+
      (hintKey?'<p class="pnf-hint">'+t(hintKey,vars)+'</p>':'');
  }
  function onCardClick(scr, field, nextId){
    $$(".pnf-card", scr).forEach(function(c){
      c.addEventListener("click", function(){
        $$(".pnf-card", scr).forEach(function(x){ x.classList.remove("is-selected"); });
        c.classList.add("is-selected");
        st.data[field] = c.getAttribute("data-val");
        setTimeout(function(){ go(nextId); }, 180);
      });
    });
  }
  function onChipClick(scr, field, nextId){
    $$(".pnf-chip", scr).forEach(function(c){
      c.addEventListener("click", function(){
        $$(".pnf-chip", scr).forEach(function(x){ x.classList.remove("is-selected"); });
        c.classList.add("is-selected");
        st.data[field] = c.getAttribute("data-val");
        setTimeout(function(){ go(nextId); }, 180);
      });
    });
  }

  // ---------- SCREEN BUILDERS ----------
  var builders = {};

  // S1 Address with autocomplete
  builders.s1 = function(){
    var html = header(null,"s1_eyebrow","")+ // eyebrow only at top
      '<p class="pnf-eyebrow">'+t("s1_eyebrow")+'</p>'+
      '<h2 class="pnf-question">'+t("s1_q")+'</h2>'+
      '<p class="pnf-hint">'+t("s1_hint")+'</p>'+
      '<input type="text" class="pnf-input" id="pnf-addr" placeholder="'+t("s1_ph")+'" autocomplete="off" />'+
      '<div class="pnf-suggestions" id="pnf-sug" hidden></div>'+
      '<input type="text" name="website" class="pnf-hp" tabindex="-1" autocomplete="off" />'+
      '<p class="pnf-error-msg"></p>'+
      navRow(false, null);
    var scr = el('<section id="pnf-screen-s1" class="pnf-screen">'+html+'</section>');
    var input = scr.querySelector("#pnf-addr"), sug = scr.querySelector("#pnf-sug"), nxt = scr.querySelector(".pnf-next");
    var debounceId;
    input.addEventListener("input", function(){
      clearTimeout(debounceId); nxt.disabled = !(input.value.trim().length>5 && st.data.place_id);
      var q = input.value.trim(); if (q.length<3){ sug.hidden=true; return; }
      debounceId = setTimeout(function(){
        api("places_proxy",{input:q}).then(function(r){
          var items = (r && r.suggestions) || []; if (!items.length){ sug.hidden=true; return; }
          sug.innerHTML = items.map(function(x){ return '<div class="pnf-suggestion" data-pid="'+x.place_id+'">'+x.text+'</div>'; }).join("");
          sug.hidden=false;
          $$(".pnf-suggestion", sug).forEach(function(s){
            s.addEventListener("click", function(){
              input.value = s.textContent; st.data.address = s.textContent; st.data.place_id = s.getAttribute("data-pid");
              // parse "1234 St, City, STATE ZIP, USA"
              var parts = s.textContent.split(",").map(function(p){ return p.trim(); });
              if (parts.length>=3){ st.data.city = parts[1]; var m = (parts[2]||"").match(/([A-Z]{2})\s*(\d{5})?/); if (m){ st.data.state = m[1]; st.data.zip = m[2]||""; } }
              sug.hidden=true; nxt.disabled=false;
            });
          });
        });
      }, 220);
    });
    nxt.addEventListener("click", function(){ if (!st.data.place_id){ setErr("s1", t("err_required")); return; } go("s2"); });
    return scr;
  };

  // S2 Property type
  builders.s2 = function(){
    var opts = [
      {v:"Single Family", emoji:"🏠", label:t("s2_sf"), sub:t("s2_sf_sub")},
      {v:"Duplex/Triplex", emoji:"🏘️", label:t("s2_du"), sub:t("s2_du_sub")},
      {v:"Multi-Family", emoji:"🏢", label:t("s2_mf"), sub:t("s2_mf_sub")},
      {v:"Mobile Home",  emoji:"🚚", label:t("s2_mh"), sub:t("s2_mh_sub")},
      {v:"Land",         emoji:"🌳", label:t("s2_lot"),sub:t("s2_lot_sub")}
    ];
    var scr = el('<section id="pnf-screen-s2" class="pnf-screen">'+
      '<p class="pnf-eyebrow">'+t("s2_eyebrow")+'</p>'+
      '<h2 class="pnf-question">'+t("s2_q")+'</h2>'+
      '<p class="pnf-hint">'+t("s2_hint")+'</p>'+
      cardsHTML(opts)+ navRow(false)+'</section>');
    onCardClick(scr, "property_type", "s3");
    wireNav(scr);
    return scr;
  };

  // Helper for simple text-input screens (name, email, phone, price, owed)
  function textScreen(id, eyebrowKey, qKey, hintKey, phKey, field, nextId, opts){
    opts = opts || {};
    var scr = el('<section id="pnf-screen-'+id+'" class="pnf-screen">'+
      header(null, eyebrowKey, qKey, hintKey)+
      (opts.prefix?'<div class="pnf-input-row"><span class="pnf-prefix">'+opts.prefix+'</span><input type="'+(opts.type||"text")+'" class="pnf-input" placeholder="'+t(phKey)+'" inputmode="'+(opts.inputmode||"text")+'" /></div>':'<input type="'+(opts.type||"text")+'" class="pnf-input" placeholder="'+t(phKey)+'" inputmode="'+(opts.inputmode||"text")+'" />')+
      '<p class="pnf-error-msg"></p>'+
      navRow(!!opts.skip)+'</section>');
    var input = scr.querySelector(".pnf-input"), nxt = scr.querySelector(".pnf-next");
    input.addEventListener("input", function(){ nxt.disabled = !input.value.trim(); setErr(id,""); });
    nxt.addEventListener("click", function(){
      var v = input.value.trim();
      if (opts.validate){ var r = opts.validate(v); if (r!==true){ setErr(id, t(r)); return; } }
      st.data[field] = v;
      if (opts.onNext) opts.onNext(v, nxt).then(function(ok){ if (ok) go(nextId); });
      else go(nextId);
    });
    wireNav(scr, null, opts.skip ? function(){ st.data[field] = ""; go(nextId); } : null);
    return scr;
  }

  builders.s3 = function(){ return textScreen("s3","s3_eyebrow","s3_q","s3_hint","s3_ph","name","s4"); };
  builders.s4 = function(){ return textScreen("s4",null,"s4_q","s4_hint","s4_ph","email","s5",{type:"email",inputmode:"email",validate:function(v){ return V.email(v)?true:"err_email"; }}); };
  builders.s5 = function(){
    return textScreen("s5",null,"s5_q","s5_hint","s5_ph","phone_raw","s6",{type:"tel",inputmode:"tel",validate:function(v){ return V.phone(v)?true:"err_phone"; },
      onNext:function(v, nxt){
        nxt.disabled = true; nxt.innerHTML = t("sending")+'<span class="pnf-spinner"></span>';
        return api("start_lead",{
          name: st.data.name, email: st.data.email, phone: v, address: st.data.address, place_id: st.data.place_id,
          property_type: st.data.property_type, city: st.data.city, state: st.data.state, zip: st.data.zip,
          elapsed_ms: Date.now() - st.pageLoadedAt, website: ""
        }).then(function(r){
          nxt.disabled = false; nxt.textContent = t("next");
          if (r && r.ok){ st.data.lead_id = r.lead_id; st.data.session_token = r.session_token; st.data.phone_masked = r.phone_masked; return true; }
          setErr("s5", (r && r.error) || t("err_generic")); return false;
        }).catch(function(){ nxt.disabled = false; nxt.textContent = t("next"); setErr("s5", t("err_generic")); return false; });
      } });
  };

  // S6 SMS verify
  builders.s6 = function(){
    var scr = el('<section id="pnf-screen-s6" class="pnf-screen">'+
      '<h2 class="pnf-question">'+t("s6_q")+'</h2>'+
      '<p class="pnf-hint" id="pnf-s6-hint"></p>'+
      '<div class="pnf-code-boxes">'+Array(6).fill(0).map(function(_,i){ return '<input maxlength="1" inputmode="numeric" pattern="\\d" data-i="'+i+'" />'; }).join("")+'</div>'+
      '<p class="pnf-error-msg"></p>'+
      '<button type="button" class="pnf-resend">'+t("resend")+'</button>'+
      navRow(false, null, "verify")+'</section>');
    scr.querySelector("#pnf-s6-hint").textContent = t("s6_hint",{phone: st.data.phone_masked||"your phone"});
    var boxes = $$(".pnf-code-boxes input", scr), nxt = scr.querySelector(".pnf-next");
    boxes.forEach(function(b,i){
      b.addEventListener("input", function(){
        b.value = b.value.replace(/\D/g,"").slice(0,1);
        if (b.value && boxes[i+1]) boxes[i+1].focus();
        var code = boxes.map(function(x){ return x.value; }).join("");
        nxt.disabled = code.length < 6;
      });
      b.addEventListener("keydown", function(e){ if (e.key==="Backspace" && !b.value && boxes[i-1]){ boxes[i-1].focus(); }});
    });
    nxt.addEventListener("click", function(){
      var code = boxes.map(function(x){ return x.value; }).join("");
      nxt.disabled = true;
      api("verify_phone",{lead_id: st.data.lead_id, session_token: st.data.session_token, code: code}).then(function(r){
        if (r && r.ok){ go("s7"); } else { setErr("s6", t("s6_wrong")); nxt.disabled = false; }
      });
    });
    scr.querySelector(".pnf-resend").addEventListener("click", function(){
      var btn = this; api("resend_code",{lead_id: st.data.lead_id, session_token: st.data.session_token}).then(function(r){
        if (r && r.ok) window.PNF_TIMER(btn, 30); else alert((r&&r.error)||t("err_generic"));
      });
    });
    wireNav(scr);
    return scr;
  };

  // Helpers for remaining card screens
  function cardScreen(id, eyebrowKey, qKey, hintKey, opts, field, nextId){
    var scr = el('<section id="pnf-screen-'+id+'" class="pnf-screen">'+
      header(null, eyebrowKey, qKey, hintKey)+ cardsHTML(opts)+ navRow(false)+'</section>');
    onCardClick(scr, field, nextId); wireNav(scr); return scr;
  }
  function chipScreen(id, qKey, values, field, nextId){
    var scr = el('<section id="pnf-screen-'+id+'" class="pnf-screen">'+
      header(null, null, qKey, null)+ chipsHTML(values)+ navRow(false)+'</section>');
    onChipClick(scr, field, nextId); wireNav(scr); return scr;
  }

  builders.s7 = function(){ return cardScreen("s7","s7_eyebrow","s7_q","s7_hint",[
    {v:"Move-in Ready",emoji:"🟢",label:t("s7_ready"),sub:t("s7_ready_sub")},
    {v:"Minor Repairs",emoji:"🟡",label:t("s7_minor"),sub:t("s7_minor_sub")},
    {v:"Major Repairs",emoji:"🟠",label:t("s7_major"),sub:t("s7_major_sub")},
    {v:"Distressed",   emoji:"🔴",label:t("s7_distress"),sub:t("s7_distress_sub")}
  ],"condition","s8"); };
  builders.s8 = function(){ return cardScreen("s8",null,"s8_q","s8_hint",[
    {v:"<5 years",emoji:"🆕",label:t("s8_new")},{v:"5-15 years",emoji:"⏳",label:t("s8_mid")},
    {v:">15 years",emoji:"🧓",label:t("s8_old")},{v:"Unknown",emoji:"❓",label:t("s8_unk")}
  ],"roof","s9"); };
  builders.s9  = function(){ return chipScreen("s9","s9_q", ["1","2","3","4","5+"], "beds","s10"); };
  builders.s10 = function(){ return chipScreen("s10","s10_q",["1","2","3","4","5+"], "baths","s11"); };
  builders.s11 = function(){ return cardScreen("s11",null,"s11_q",null,[
    {v:"Owner",emoji:"🏡",label:t("s11_owner"),sub:t("s11_owner_sub")},
    {v:"Rented",emoji:"🔑",label:t("s11_rented"),sub:t("s11_rented_sub")},
    {v:"Vacant",emoji:"🚪",label:t("s11_vacant"),sub:t("s11_vacant_sub")}
  ],"occupancy","s12"); };

  // S12 textarea (skip allowed)
  builders.s12 = function(){
    var scr = el('<section id="pnf-screen-s12" class="pnf-screen">'+
      header(null,null,"s12_q","s12_hint")+
      '<textarea class="pnf-textarea" placeholder="'+t("s12_ph")+'"></textarea>'+
      '<p class="pnf-error-msg"></p>'+ navRow(true)+'</section>');
    var ta = scr.querySelector("textarea"), nxt = scr.querySelector(".pnf-next");
    ta.addEventListener("input", function(){ nxt.disabled = !ta.value.trim(); });
    nxt.addEventListener("click", function(){ st.data.issues = ta.value.trim(); go("s13"); });
    wireNav(scr, null, function(){ st.data.issues = ""; go("s13"); });
    return scr;
  };

  builders.s13 = function(){ return cardScreen("s13","s13_eyebrow","s13_q",null,[
    {v:"ASAP",emoji:"⚡",label:t("s13_asap"),sub:t("s13_asap_sub")},
    {v:"30 days",emoji:"📅",label:t("s13_30")},
    {v:"60-90 days",emoji:"📆",label:t("s13_60")},
    {v:"Exploring",emoji:"🧭",label:t("s13_expl"),sub:t("s13_expl_sub")}
  ],"timeline","s14"); };
  builders.s14 = function(){ return cardScreen("s14",null,"s14_q","s14_hint",[
    {v:"Highest Cash",emoji:"💰",label:t("s14_cash")},
    {v:"Fast Close",emoji:"⚡",label:t("s14_fast")},
    {v:"As-Is Sale",emoji:"🧱",label:t("s14_asis")},
    {v:"No Hassle",emoji:"🧘",label:t("s14_nohassle")}
  ],"priority","s15"); };

  builders.s15 = function(){ return textScreen("s15",null,"s15_q","s15_hint","s15_ph","asking_price","s16",{type:"text",inputmode:"numeric",prefix:"$",skip:true}); };
  builders.s16 = function(){ return cardScreen("s16",null,"s16_q","s16_hint",[
    {v:"All Cash",emoji:"💵",label:t("s16_cash")},
    {v:"Down+Monthly",emoji:"📆",label:t("s16_down")},
    {v:"Open",emoji:"🤝",label:t("s16_open")}
  ],"payment_pref","s17"); };

  builders.s17 = function(){
    var scr = el('<section id="pnf-screen-s17" class="pnf-screen">'+
      header(null,null,"s17_q","s17_hint")+
      '<div class="pnf-input-row"><span class="pnf-prefix">$</span><input type="text" class="pnf-input" inputmode="numeric" placeholder="'+t("s17_ph")+'" /></div>'+
      '<p class="pnf-error-msg"></p>'+ navRow(true,null,"submitting")+'</section>');
    var input = scr.querySelector("input"), nxt = scr.querySelector(".pnf-next");
    nxt.disabled = false; nxt.textContent = t("next");
    input.addEventListener("input", function(){ st.data.amount_owed = input.value.replace(/[^\d]/g,""); });
    nxt.addEventListener("click", function(){
      nxt.disabled = true; nxt.innerHTML = t("submitting")+'<span class="pnf-spinner"></span>';
      window.PNF_SUBMIT();
    });
    wireNav(scr, null, function(){ st.data.amount_owed = ""; nxt.disabled = true; nxt.innerHTML = t("submitting")+'<span class="pnf-spinner"></span>'; window.PNF_SUBMIT(); });
    return scr;
  };

  // OK final
  builders.ok = function(){
    var scr = el('<section id="pnf-screen-ok" class="pnf-screen">'+
      '<div class="pnf-success">'+
      '<div class="pnf-success-icon">✓</div>'+
      '<h2>'+t("ok_title")+'</h2>'+
      '<p>'+t("ok_msg",{name: st.data.name.split(" ")[0] || ""})+'</p>'+
      '<div class="pnf-score">'+t("ok_score",{score: st.data.score||"—"})+'</div>'+
      '</div></section>');
    return scr;
  };

  // ---------- MOUNT ----------
  function mountAll(){
    var stage = document.getElementById("pnf-stage");
    if (!stage) return;
    stage.innerHTML = "";
    ["s1","s2","s3","s4","s5","s6","s7","s8","s9","s10","s11","s12","s13","s14","s15","s16","s17","ok"]
      .forEach(function(id){ stage.appendChild(builders[id]()); });
  }
  window.PNF_SCREENS = { rerender: mountAll };

  document.addEventListener("DOMContentLoaded", mountAll);
})();

</script>
