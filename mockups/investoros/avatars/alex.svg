<svg viewBox="0 0 200 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ALEX — Chief Orchestrator">
  <defs>
    <radialGradient id="alex-shine" cx="35%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#1F6B53" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0D3B2E" stop-opacity="1"/>
    </radialGradient>
  </defs>

  <!-- Drop shadow on ground -->
  <ellipse cx="100" cy="205" rx="58" ry="6" fill="#0D3B2E" opacity="0.18"/>

  <!-- Antenna -->
  <line x1="100" y1="38" x2="100" y2="22" stroke="#0D3B2E" stroke-width="3" stroke-linecap="round"/>
  <circle cx="100" cy="18" r="6" fill="#C9A84C"/>
  <circle cx="98" cy="16" r="2" fill="#FAF7F2" opacity="0.7"/>

  <!-- Body capsule -->
  <rect x="42" y="52" width="116" height="138" rx="48" ry="48" fill="url(#alex-shine)" stroke="#0A2F25" stroke-width="2"/>

  <!-- Face screen -->
  <rect x="58" y="78" width="84" height="68" rx="22" ry="22" fill="#0A2F25"/>

  <!-- Eyes -->
  <circle cx="80" cy="108" r="8" fill="#FAF7F2"/>
  <circle cx="82" cy="106" r="3.5" fill="#0D3B2E"/>
  <circle cx="120" cy="108" r="8" fill="#FAF7F2"/>
  <circle cx="122" cy="106" r="3.5" fill="#0D3B2E"/>

  <!-- Smile -->
  <path d="M 84 128 Q 100 138 116 128" stroke="#C9A84C" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Headset signature -->
  <path d="M 42 88 Q 100 38 158 88" stroke="#C9A84C" stroke-width="5" fill="none" stroke-linecap="round"/>
  <circle cx="42" cy="88" r="6" fill="#C9A84C"/>
  <circle cx="158" cy="88" r="6" fill="#C9A84C"/>
  <rect x="40" y="86" width="6" height="14" rx="2" fill="#C9A84C"/>
  <rect x="154" y="86" width="6" height="14" rx="2" fill="#C9A84C"/>

  <!-- Chest emblem -->
  <circle cx="100" cy="170" r="9" fill="#C9A84C" opacity="0.95"/>
  <text x="100" y="174" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="700" fill="#0D3B2E">A</text>

  <!-- Side rivets -->
  <circle cx="50" cy="120" r="2.5" fill="#C9A84C" opacity="0.7"/>
  <circle cx="150" cy="120" r="2.5" fill="#C9A84C" opacity="0.7"/>
</svg>
