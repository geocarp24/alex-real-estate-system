<svg viewBox="0 0 200 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Vera — Quality Verification">
  <defs>
    <radialGradient id="vera-shine" cx="35%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#E8C972" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#C9A84C" stop-opacity="1"/>
    </radialGradient>
  </defs>

  <ellipse cx="100" cy="205" rx="58" ry="6" fill="#0D3B2E" opacity="0.18"/>

  <!-- Antenna with check tip -->
  <line x1="100" y1="38" x2="100" y2="22" stroke="#7B6620" stroke-width="3" stroke-linecap="round"/>
  <circle cx="100" cy="18" r="7" fill="#0D3B2E"/>
  <path d="M 96 18 L 99 21 L 104 15" stroke="#7FFFB6" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Body -->
  <rect x="42" y="52" width="116" height="138" rx="48" ry="48" fill="url(#vera-shine)" stroke="#7B6620" stroke-width="2"/>

  <!-- Face screen -->
  <rect x="58" y="78" width="84" height="68" rx="22" ry="22" fill="#7B6620"/>

  <!-- Eyes — alert/inquisitive (one slightly raised brow) -->
  <circle cx="80" cy="110" r="8" fill="#FAF7F2"/>
  <circle cx="82" cy="108" r="3.5" fill="#0D3B2E"/>
  <circle cx="120" cy="110" r="8" fill="#FAF7F2"/>
  <circle cx="122" cy="108" r="3.5" fill="#0D3B2E"/>
  <!-- raised brow over right eye -->
  <path d="M 112 96 L 128 98" stroke="#FAF7F2" stroke-width="2" stroke-linecap="round"/>
  <path d="M 72 100 L 88 100" stroke="#FAF7F2" stroke-width="2" stroke-linecap="round"/>

  <!-- Neutral straight mouth -->
  <line x1="88" y1="132" x2="112" y2="132" stroke="#FAF7F2" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Magnifying glass accessory (held in hand on right side) -->
  <circle cx="160" cy="140" r="14" fill="none" stroke="#7B6620" stroke-width="3"/>
  <circle cx="160" cy="140" r="11" fill="#FAF7F2" opacity="0.4"/>
  <line x1="170" y1="150" x2="180" y2="160" stroke="#7B6620" stroke-width="4" stroke-linecap="round"/>
  <line x1="153" y1="135" x2="167" y2="145" stroke="#FAF7F2" stroke-width="1.5" opacity="0.7"/>

  <!-- Chest checkmark badge -->
  <circle cx="100" cy="170" r="10" fill="#7B6620"/>
  <path d="M 95 170 L 99 174 L 106 167" stroke="#7FFFB6" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Side rivets -->
  <circle cx="50" cy="120" r="2.5" fill="#7B6620" opacity="0.7"/>
</svg>
