name: Deploy to Hostinger via SSH

on:
  push:
    branches: [master]
    paths:
      - 'hostinger/**'
      - '.github/workflows/deploy-hostinger.yml'

jobs:
  deploy:
    name: SSH Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy Tools PHP files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          source: "hostinger/tools/*"
          target: /home/u433637438/domains/pinnaclegroupwi.com/public_html/Tools/
          strip_components: 2

      - name: Deploy Agents PHP files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          source: "hostinger/agents/*"
          target: /home/u433637438/domains/pinnaclegroupwi.com/public_html/agents/
          strip_components: 2

      - name: Write config.php via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cat > /home/u433637438/domains/pinnaclegroupwi.com/public_html/Tools/config.php << 'PHPEOF'
            <?php
            /**
             * config.php — API Keys
             * Auto-generated by GitHub Actions. Do not edit manually.
             */
            define('AIRTABLE_TOKEN',  '${{ secrets.AIRTABLE_TOKEN }}');
            define('TRACERFY_TOKEN',  '${{ secrets.TRACERFY_TOKEN }}');
            PHPEOF
            echo "config.php written OK"
