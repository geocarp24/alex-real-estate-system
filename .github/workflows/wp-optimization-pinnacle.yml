name: WP Optimization — Pinnacle Holdings (pinnaclegroupwi.com)

on:
  workflow_dispatch:
    inputs:
      steps:
        description: 'Steps to run (comma list: 01,02,03 or "all")'
        required: true
        default: '01,02,03'
        type: string
      pixel_id:
        description: 'Meta Pixel ID (only used if step 04 is in the list)'
        required: false
        type: string
      clarity_id:
        description: 'Microsoft Clarity ID (only used if step 04 is in the list)'
        required: false
        type: string
  push:
    branches:
      - claude/remove-unused-make-scenarios-17mEX
    paths:
      - 'hostinger/wp-optimization-pinnacle/scripts/**'
      - 'hostinger/wp-optimization-pinnacle/mu-plugins/**'
      - '.github/workflows/wp-optimization-pinnacle.yml'

concurrency:
  group: wp-optimization-pinnacle-holdings
  cancel-in-progress: false

jobs:
  deploy:
    name: Run WP-CLI optimizations on Hostinger
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve steps to run
        id: resolve
        run: |
          STEPS="${{ github.event.inputs.steps }}"
          if [ -z "$STEPS" ]; then
            # Push event: run safe defaults (00 + 01 + 02 + 03). Tracking (04) never auto-runs.
            STEPS="01,02,03"
          fi
          if [ "$STEPS" = "all" ]; then
            STEPS="01,02,03,04"
          fi
          echo "steps=$STEPS" >> "$GITHUB_OUTPUT"
          echo "Will run: $STEPS"

      - name: Inline rollback via SSH (no SCP)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          timeout: 60s
          command_timeout: 10m
          script: |
            set -uo pipefail
            export WP_PATH="$HOME/domains/pinnaclegroupwi.com/public_html"
            export BACKUP_DIR="$HOME/alex_backups/wp-optimization-pinnacle"
            export PATH="/usr/local/bin:$PATH"

            echo "=== Pinnacle Holdings — EMERGENCY ROLLBACK ==="
            echo "WP_PATH:    $WP_PATH"
            echo "BACKUP_DIR: $BACKUP_DIR"
            echo

            if [ ! -d "$BACKUP_DIR" ]; then
              echo "FATAL: backup dir does not exist"
              exit 1
            fi

            echo "--- All backup snapshots found ---"
            ls -la "$BACKUP_DIR"/ || true
            echo

            OLDEST=$(ls -1d "$BACKUP_DIR"/*/ 2>/dev/null | sort | head -1)
            OLDEST="${OLDEST%/}"
            if [ -z "$OLDEST" ]; then
              echo "FATAL: no snapshot directories inside $BACKUP_DIR"
              exit 1
            fi
            echo "Selected OLDEST snapshot: $OLDEST"
            echo "--- Files in oldest snapshot ---"
            ls -la "$OLDEST/" || true
            echo

            cd "$WP_PATH"

            echo "--- Restoring pages from snapshot ---"
            shopt -s nullglob
            for f in "$OLDEST"/*.html; do
              bname=$(basename "$f")
              pid=$(echo "$bname" | grep -oE '[0-9]+' | tail -1)
              label=$(echo "$bname" | sed -E 's/_[0-9]+\.html$//')
              size=$(wc -c < "$f")
              if [ -z "${pid:-}" ] || [ "$pid" = "0" ]; then
                echo "  skip $bname (no pid)"
                continue
              fi
              if [ "$size" -lt 200 ]; then
                echo "  skip $bname (too small: ${size}B)"
                continue
              fi
              if wp post update "$pid" --post_content=- < "$f" >/dev/null 2>&1; then
                echo "  RESTORED $label (id=$pid) from $bname (${size}B)"
              else
                echo "  FAILED to restore $label (id=$pid)"
              fi
            done

            echo
            echo "--- Restoring astra-settings ---"
            ASTRA_JSON="$OLDEST/astra-settings.json"
            if [ -f "$ASTRA_JSON" ] && [ "$(wc -c < "$ASTRA_JSON")" -gt 10 ]; then
              if wp option update astra-settings "$(cat "$ASTRA_JSON")" --format=json >/dev/null 2>&1; then
                echo "  RESTORED astra-settings ($(wc -c < "$ASTRA_JSON")B)"
              else
                echo "  FAILED to restore astra-settings"
              fi
            else
              echo "  skip: astra-settings.json missing or empty"
            fi

            echo
            echo "--- Purging cache ---"
            wp litespeed-purge all >/dev/null 2>&1 && echo "  LiteSpeed purged" \
              || wp cache flush >/dev/null 2>&1 && echo "  WP cache flushed" \
              || echo "  no cache plugin"

            echo
            echo "--- Verifying restored content ---"
            HOME_PID=$(wp option get page_on_front 2>/dev/null)
            HOME_SIZE=$(wp post get "$HOME_PID" --field=post_content 2>/dev/null | wc -c)
            echo "  home (id=$HOME_PID) post_content: ${HOME_SIZE}B"

            echo
            echo "=== ROLLBACK COMPLETE ==="

      - name: Verify live site
        run: |
          sleep 5
          echo "--- Checking <code> wrappers (expect 0) ---"
          CODE_COUNT=$(curl -s https://pinnaclegroupwi.com/ | grep -oE '<code>[^<]+</code>' | wc -l)
          echo "code wrappers: $CODE_COUNT"

          echo "--- Checking hello-world redirect ---"
          curl -sI https://pinnaclegroupwi.com/hello-world/ | head -2

          echo "--- Checking brand palette hex values ---"
          curl -s https://pinnaclegroupwi.com/ | grep -oE '#0D3B2E|#C9A84C' | sort -u || echo "(palette hex not found in HTML — may be in CSS)"
