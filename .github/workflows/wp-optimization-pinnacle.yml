name: WP Optimization — Pinnacle Holdings (pinnaclegroupwi.com)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode: deploy-home | rollback | custom'
        required: true
        default: 'deploy-home'
        type: string
  push:
    branches:
      - claude/remove-unused-make-scenarios-17mEX
    paths:
      - 'hostinger/wp-optimization-pinnacle/scripts/**'
      - 'hostinger/wp-optimization-pinnacle/mu-plugins/**'
      - 'hostinger/wp-optimization-pinnacle/content/**'
      - '.github/workflows/wp-optimization-pinnacle.yml'

concurrency:
  group: wp-optimization-pinnacle-holdings
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy home page via SSH + GitHub API fetch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (for YAML context only)
        uses: actions/checkout@v4

      - name: Deploy home.html via SSH (no SCP, server-side curl)
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          BRANCH: claude/remove-unused-make-scenarios-17mEX
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          envs: GH_PAT,BRANCH
          timeout: 120s
          command_timeout: 10m
          script: |
            set -uo pipefail
            export WP_PATH="$HOME/domains/pinnaclegroupwi.com/public_html"
            export BACKUP_DIR="$HOME/alex_backups/wp-optimization-pinnacle"
            export PATH="/usr/local/bin:$PATH"

            echo "=== Pinnacle WP — Home Deploy ==="
            echo "WP_PATH: $WP_PATH"
            echo

            mkdir -p "$BACKUP_DIR"
            TS=$(date +%Y%m%d_%H%M%S)
            SNAP="$BACKUP_DIR/pre-home-deploy_$TS"
            mkdir -p "$SNAP"

            HOME_PID=$(wp --path="$WP_PATH" option get page_on_front 2>/dev/null)
            if [ -z "${HOME_PID:-}" ] || [ "$HOME_PID" = "0" ]; then
              echo "FATAL: cannot determine home page ID"
              exit 1
            fi
            echo "Home page ID: $HOME_PID"

            echo "--- [1/5] Snapshot current home post_content ---"
            CUR_SIZE=$(wp --path="$WP_PATH" post get "$HOME_PID" --field=post_content 2>/dev/null | tee "$SNAP/home_${HOME_PID}.html" | wc -c)
            echo "  saved snapshot: $SNAP/home_${HOME_PID}.html (${CUR_SIZE}B)"

            echo "--- [2/5] Fetch new home.html from GitHub (private repo via API) ---"
            NEW_FILE="/tmp/pinnacle_home_new_$$.html"
            curl -sS --fail \
              -H "Authorization: Bearer $GH_PAT" \
              -H "Accept: application/vnd.github.raw" \
              "https://api.github.com/repos/geocarp24/alex-real-estate-system/contents/hostinger/wp-optimization-pinnacle/content/home.html?ref=$BRANCH" \
              -o "$NEW_FILE"
            if [ ! -s "$NEW_FILE" ]; then
              echo "FATAL: fetched file is empty"
              exit 1
            fi
            NEW_SIZE=$(wc -c < "$NEW_FILE")
            echo "  fetched: $NEW_FILE (${NEW_SIZE}B)"

            echo "--- [3/5] Validate block structure (balanced wp: comments) ---"
            OPENS=$(grep -oE '<!-- wp:' "$NEW_FILE" | wc -l)
            CLOSES=$(grep -oE '<!-- /wp:' "$NEW_FILE" | wc -l)
            echo "  wp: open=$OPENS  close=$CLOSES"
            if [ "$OPENS" != "$CLOSES" ]; then
              echo "FATAL: block opens/closes mismatch — aborting before update"
              exit 1
            fi

            echo "--- [4/5] Update home post_content (stdin pipe, no bash vars) ---"
            if wp --path="$WP_PATH" post update "$HOME_PID" --post_content=- < "$NEW_FILE"; then
              echo "  SUCCESS: wp post update returned 0"
            else
              echo "  FAILED: wp post update returned non-zero"
              exit 1
            fi

            echo "--- [5/5] Verify and purge cache ---"
            VERIFY_SIZE=$(wp --path="$WP_PATH" post get "$HOME_PID" --field=post_content 2>/dev/null | wc -c)
            echo "  new post_content size: ${VERIFY_SIZE}B (expected ~${NEW_SIZE}B)"
            wp --path="$WP_PATH" litespeed-purge all >/dev/null 2>&1 && echo "  LiteSpeed purged" \
              || wp --path="$WP_PATH" cache flush >/dev/null 2>&1 && echo "  WP cache flushed" \
              || echo "  no cache plugin"

            rm -f "$NEW_FILE"
            echo
            echo "=== HOME DEPLOYED ==="
            echo "Rollback snapshot: $SNAP/home_${HOME_PID}.html"

      - name: Verify live site
        run: |
          sleep 5
          SIZE=$(curl -s https://pinnaclegroupwi.com/ | wc -c)
          HAS_HERO=$(curl -s https://pinnaclegroupwi.com/ | grep -c 'We Buy Houses in Green Bay' || true)
          HAS_FORM=$(curl -s https://pinnaclegroupwi.com/ | grep -c 'Get Your Free Cash Offer' || true)
          echo "home size: ${SIZE}B"
          echo "hero present: $HAS_HERO"
          echo "CTA present: $HAS_FORM"
