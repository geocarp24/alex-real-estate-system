name: WP Optimization — Pinnacle Holdings (pinnaclegroupwi.com)

on:
  workflow_dispatch:
    inputs:
      steps:
        description: 'Steps to run (comma list: 01,02,03 or "all")'
        required: true
        default: '01,02,03'
        type: string
      pixel_id:
        description: 'Meta Pixel ID (only used if step 04 is in the list)'
        required: false
        type: string
      clarity_id:
        description: 'Microsoft Clarity ID (only used if step 04 is in the list)'
        required: false
        type: string
  push:
    branches:
      - claude/remove-unused-make-scenarios-17mEX
    paths:
      - 'hostinger/wp-optimization-pinnacle/scripts/**'
      - 'hostinger/wp-optimization-pinnacle/mu-plugins/**'
      - '.github/workflows/wp-optimization-pinnacle.yml'

concurrency:
  group: wp-optimization-pinnacle-holdings
  cancel-in-progress: false

jobs:
  deploy:
    name: Run WP-CLI optimizations on Hostinger
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve steps to run
        id: resolve
        run: |
          STEPS="${{ github.event.inputs.steps }}"
          if [ -z "$STEPS" ]; then
            # Push event: run safe defaults (00 + 01 + 02 + 03). Tracking (04) never auto-runs.
            STEPS="01,02,03"
          fi
          if [ "$STEPS" = "all" ]; then
            STEPS="01,02,03,04"
          fi
          echo "steps=$STEPS" >> "$GITHUB_OUTPUT"
          echo "Will run: $STEPS"

      - name: Copy optimization scripts to Hostinger
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          source: "hostinger/wp-optimization-pinnacle/scripts/*"
          target: /home/u433637438/wp-optimization-pinnacle-staging/scripts/
          strip_components: 3
          overwrite: true

      - name: Copy MU-plugin to Hostinger
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          source: "hostinger/wp-optimization-pinnacle/mu-plugins/*"
          target: /home/u433637438/wp-optimization-pinnacle-staging/mu-plugins/
          strip_components: 3
          overwrite: true

      - name: Execute optimization steps
        uses: appleboy/ssh-action@v1.0.3
        env:
          STEPS: ${{ steps.resolve.outputs.steps }}
          META_PIXEL_ID: ${{ github.event.inputs.pixel_id }}
          CLARITY_ID: ${{ github.event.inputs.clarity_id }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          envs: STEPS,META_PIXEL_ID,CLARITY_ID
          command_timeout: 10m
          script: |
            set -uo pipefail
            STAGE="$HOME/wp-optimization-pinnacle-staging"
            export WP_PATH="$HOME/domains/pinnaclegroupwi.com/public_html"
            export PATH="/usr/local/bin:$PATH"

            cd "$STAGE/scripts"
            chmod +x ./*.sh

            echo "=== Pinnacle Holdings — EMERGENCY ROLLBACK MODE ==="
            echo "WP_PATH: $WP_PATH"
            echo "(Applying scripts is DISABLED until 01 is rewritten safely)"
            echo

            echo "--- 99-rollback.sh ---"
            ./99-rollback.sh
            echo
            echo "=== Done. ==="

      - name: Verify live site
        run: |
          sleep 5
          echo "--- Checking <code> wrappers (expect 0) ---"
          CODE_COUNT=$(curl -s https://pinnaclegroupwi.com/ | grep -oE '<code>[^<]+</code>' | wc -l)
          echo "code wrappers: $CODE_COUNT"

          echo "--- Checking hello-world redirect ---"
          curl -sI https://pinnaclegroupwi.com/hello-world/ | head -2

          echo "--- Checking brand palette hex values ---"
          curl -s https://pinnaclegroupwi.com/ | grep -oE '#0D3B2E|#C9A84C' | sort -u || echo "(palette hex not found in HTML — may be in CSS)"
