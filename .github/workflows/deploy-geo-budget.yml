name: Deploy Geo Budget Builder to Hostinger

on:
  push:
    branches: [master]
    paths:
      - 'geo-budget/**'
      - '.github/workflows/deploy-geo-budget.yml'

jobs:
  deploy:
    name: SSH Deploy GeoBudget
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy app files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          source: "geo-budget/*"
          target: /home/u433637438/domains/pinnaclegroupwi.com/public_html/GeoBudget/
          strip_components: 1

      - name: Write api/config.php via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            mkdir -p /home/u433637438/domains/pinnaclegroupwi.com/public_html/GeoBudget/api
            cat > /home/u433637438/domains/pinnaclegroupwi.com/public_html/GeoBudget/api/config.php << 'PHPEOF'
            <?php
            /**
             * config.php — Geo Carpentry Budget Builder
             * Auto-generated by GitHub Actions. Do not edit manually.
             */
            define('ANTHROPIC_KEY', '${{ secrets.ANTHROPIC_KEY }}');
            define('APP_TOKEN',     '${{ secrets.GEO_BUDGET_TOKEN }}');
            PHPEOF
            echo "GeoBudget api/config.php written OK"
