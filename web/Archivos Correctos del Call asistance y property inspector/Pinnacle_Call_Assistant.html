<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pinnacle Call Assistant</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f5f5f0;color:#2c2c2a;font-size:14px}
/* LOGIN */
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:#f5f5f0}
.login-card{background:#fff;border-radius:14px;border:1px solid #d3d1c7;padding:40px;width:400px;text-align:center}
.login-logo{width:56px;height:56px;background:#085041;border-radius:12px;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;font-size:26px}
.login-card h1{font-size:20px;color:#085041;margin-bottom:4px;font-weight:bold}
.login-sub{color:#888780;font-size:12px;margin-bottom:20px}
.login-field{margin-bottom:12px;text-align:left}
.login-field label{display:block;font-size:11px;font-weight:bold;color:#444441;margin-bottom:5px;text-transform:uppercase;letter-spacing:0.04em}
.login-field input{width:100%;padding:11px 14px;border:1px solid #d3d1c7;border-radius:8px;font-size:14px;outline:none;color:#2c2c2a;background:#fff}
.login-field input:focus{border-color:#1D9E75}
.login-btn{width:100%;padding:13px;background:#085041;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:bold;cursor:pointer;margin-top:6px}
.login-btn:disabled{background:#b4b2a9;cursor:not-allowed}
.login-error{background:#fcebeb;border:1px solid #f7c1c1;border-radius:8px;padding:9px 14px;font-size:13px;color:#A32D2D;margin-top:12px;display:none}
.login-note{font-size:11px;color:#b4b2a9;margin-top:14px}
.test-badge{background:#faeeda;border:1px solid #BA7517;border-radius:6px;padding:6px 12px;font-size:11px;color:#633806;margin-bottom:16px}
/* APP SHELL */
#app{display:none;height:100vh;flex-direction:column}
.topbar{background:#085041;color:#fff;padding:9px 20px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.topbar h1{font-size:13px;font-weight:bold}
.t-right{display:flex;align-items:center;gap:10px}
.t-user{font-size:11px;background:rgba(255,255,255,0.15);padding:2px 10px;border-radius:20px}
.t-logout{background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);color:#fff;padding:3px 10px;border-radius:5px;font-size:11px;cursor:pointer}
.searchbar{background:#fff;border-bottom:1px solid #d3d1c7;padding:8px 20px;display:flex;gap:8px;flex-shrink:0}
.searchbar input{flex:1;padding:7px 12px;border:1px solid #d3d1c7;border-radius:8px;font-size:13px;outline:none}
.searchbar input:focus{border-color:#1D9E75}
.btn-g{padding:7px 16px;background:#1D9E75;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:bold}
.btn-x{padding:7px 12px;background:#f1efe8;color:#444441;border:1px solid #d3d1c7;border-radius:8px;cursor:pointer;font-size:13px}
#cdd{background:#fff;border-bottom:1px solid #d3d1c7;max-height:160px;overflow-y:auto;display:none;flex-shrink:0}
.ci{padding:8px 20px;cursor:pointer;border-bottom:1px solid #f1efe8;display:flex;justify-content:space-between;align-items:center}
.ci:hover{background:#e1f5ee}
.cn{font-weight:bold;font-size:13px}.cm{font-size:11px;color:#888780}
.stg{font-size:11px;padding:2px 7px;border-radius:99px;background:#e1f5ee;color:#085041;font-weight:bold}
/* BODY GRID */
.body-grid{display:grid;grid-template-columns:260px 1fr;flex:1;overflow:hidden}
/* LEFT PANEL */
.left{background:#fff;border-right:1px solid #d3d1c7;overflow-y:auto;padding:12px}
.pt{font-size:10px;font-weight:bold;text-transform:uppercase;letter-spacing:0.08em;color:#888780;margin-bottom:8px}
.ib{margin-bottom:12px}
.ib h3{font-size:10px;font-weight:bold;color:#085041;text-transform:uppercase;letter-spacing:0.04em;border-bottom:2px solid #e1f5ee;padding-bottom:3px;margin-bottom:6px}
.ir{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid #f5f5f0;font-size:11px}
.il{color:#888780;flex-shrink:0;padding-right:6px}
.iv{font-weight:bold;text-align:right;word-break:break-word}
.iv.g{color:#085041}.iv.r{color:#A32D2D}.iv.b{color:#185FA5}
.em{text-align:center;padding:30px 10px;color:#b4b2a9;font-size:12px;font-style:italic}
/* RIGHT PANEL — STEP VIEW */
.right{overflow:hidden;display:flex;flex-direction:column;background:#f5f5f0}
/* STEP TABS BAR */
.steps-bar{background:#fff;border-bottom:1px solid #d3d1c7;padding:8px 16px;display:flex;gap:6px;overflow-x:auto;flex-shrink:0}
.steps-bar::-webkit-scrollbar{height:3px}
.steps-bar::-webkit-scrollbar-thumb{background:#d3d1c7;border-radius:99px}
.step-tab{padding:4px 10px;border-radius:99px;font-size:11px;font-weight:bold;cursor:pointer;white-space:nowrap;border:1px solid transparent;flex-shrink:0}
.step-tab.done{background:#e1f5ee;color:#085041;border-color:#085041}
.step-tab.active{background:#085041;color:#fff}
.step-tab.pending{background:#f1efe8;color:#888780;border-color:#d3d1c7}
.step-tab.internal{background:#faeeda;color:#633806;border-color:#BA7517}
/* STEP CONTENT AREA */
.step-content{flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:14px}
/* SCRIPT BUBBLE */
.script-bubble{background:#e1f5ee;border-left:3px solid #1D9E75;border-radius:0 8px 8px 0;padding:10px 14px;font-size:13px;line-height:1.65}
.script-bubble.p{background:#fcebeb;border-left-color:#A32D2D}
.script-bubble.d{background:#e6f1fb;border-left-color:#185FA5}
.note-bubble{background:#faeeda;border-left:3px solid #BA7517;border-radius:0 8px 8px 0;padding:7px 12px;font-size:12px;color:#633806;line-height:1.5}
.internal-badge{background:#faeeda;border:1px solid #BA7517;border-radius:6px;padding:5px 12px;font-size:11px;color:#633806;font-weight:bold;text-align:center}
/* INPUT CARD */
.input-card{background:#fff;border-radius:12px;border:1px solid #d3d1c7;padding:16px 18px}
.input-card label{display:block;font-size:12px;font-weight:bold;color:#444441;margin-bottom:10px}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choice-btn{padding:9px 18px;border:1.5px solid #d3d1c7;border-radius:8px;background:#fff;cursor:pointer;font-size:13px;font-weight:500;color:#444441;transition:all 0.15s}
.choice-btn:hover{border-color:#1D9E75;background:#e1f5ee;color:#085041}
.choice-btn.yes{border-color:#1D9E75}.choice-btn.danger{border-color:#A32D2D}
.rating-row{display:flex;gap:6px;flex-wrap:wrap}
.rb{width:40px;height:40px;border:1.5px solid #d3d1c7;border-radius:8px;background:#fff;cursor:pointer;font-size:13px;font-weight:bold;color:#444441}
.rb:hover{background:#e1f5ee;border-color:#1D9E75}
.rb.sel{background:#085041;color:#fff;border-color:#085041}
.flow-input{width:100%;padding:10px 13px;border:1.5px solid #d3d1c7;border-radius:8px;font-size:14px;font-family:Arial;outline:none;background:#fff;color:#2c2c2a}
.flow-input:focus{border-color:#1D9E75}
.input-row{display:flex;gap:8px;align-items:center}
.input-row .flow-input{flex:1}
.btn-next{padding:10px 20px;background:#085041;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:bold;cursor:pointer;white-space:nowrap}
.btn-skip{padding:10px 14px;background:transparent;color:#888780;border:1px solid #d3d1c7;border-radius:8px;font-size:12px;cursor:pointer}
.btn-back{padding:10px 14px;background:transparent;color:#444441;border:1px solid #d3d1c7;border-radius:8px;font-size:12px;cursor:pointer}
/* CONFIRM VALUE */
.confirm-val-card{background:#f5f5f0;border-radius:8px;padding:10px 14px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.cv-val{font-size:16px;font-weight:bold;color:#085041}
.cv-actions{display:flex;gap:6px}
.cbtn{padding:7px 14px;border-radius:6px;font-size:12px;font-weight:bold;cursor:pointer;border:none}
.cbtn.yes{background:#1D9E75;color:#fff}.cbtn.no{background:#f1efe8;color:#444441;border:1px solid #d3d1c7}
/* NAV ROW */
.nav-row{display:flex;gap:8px;align-items:center;justify-content:space-between}
/* REALTOR CALC */
.calc-card{background:#f5f5f0;border-radius:10px;padding:14px 16px}
.calc-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #d3d1c7;font-size:13px}
.calc-row.total{border-bottom:none;border-top:2px solid #085041;margin-top:4px;padding-top:8px;font-weight:bold;font-size:15px}
.calc-row .lbl{color:#888780}.calc-row.total .lbl{color:#2c2c2a}
.calc-row .val.r{color:#A32D2D}.calc-row.total .val{color:#085041}
/* SAVE */
.save-card{background:#fff;border-radius:12px;border:2px solid #085041;padding:18px}
.save-card h3{font-size:14px;font-weight:bold;color:#085041;margin-bottom:14px}
.save-summary{background:#f5f5f0;border-radius:8px;padding:12px;margin-bottom:14px;font-size:12px;line-height:1.9;color:#444441}
.save-field{margin-bottom:10px}
.save-field label{display:block;font-size:12px;font-weight:bold;color:#444441;margin-bottom:4px}
.save-field select,.save-field textarea{width:100%;padding:8px 12px;border:1px solid #d3d1c7;border-radius:8px;font-size:13px;font-family:Arial;outline:none;background:#fff}
.save-field textarea{min-height:65px;resize:vertical}
.btn-save{width:100%;padding:13px;background:#085041;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:bold;cursor:pointer;margin-top:4px}
.btn-save:hover{background:#0F6E56}
.btn-save:disabled{background:#b4b2a9;cursor:not-allowed}
/* RESUME */
.resume-card{background:#fff;border-radius:12px;border:2px solid #BA7517;padding:24px;text-align:center;max-width:440px;margin:40px auto}
.resume-card h3{font-size:15px;font-weight:bold;color:#633806;margin-bottom:8px}
.resume-card p{font-size:13px;color:#444441;margin-bottom:18px}
.resume-btns{display:flex;gap:10px;justify-content:center}
.btn-resume{padding:11px 24px;background:#085041;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:bold;cursor:pointer}
.btn-restart-sm{padding:11px 24px;background:#f1efe8;color:#444441;border:1px solid #d3d1c7;border-radius:8px;font-size:14px;cursor:pointer}
/* STYPE GRID */
.stype-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.stype-card{border:2px solid #d3d1c7;border-radius:10px;padding:16px 12px;text-align:center;cursor:pointer;transition:all 0.15s}
.stype-card:hover{border-color:#1D9E75}
.stype-card.sel-m{border-color:#085041;background:#e1f5ee}
.stype-card.sel-p{border-color:#A32D2D;background:#fcebeb}
.stype-card.sel-d{border-color:#185FA5;background:#e6f1fb}
.stype-icon{font-size:24px;margin-bottom:6px}
.stype-name{font-size:13px;font-weight:bold;color:#2c2c2a}
.stype-desc{font-size:11px;color:#888780;margin-top:3px}
/* DATETIME */
.datetime-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.dt-lbl{font-size:11px;color:#888780;margin-bottom:4px}
/* TOAST */
.toast{position:fixed;bottom:18px;right:18px;background:#085041;color:#fff;padding:11px 16px;border-radius:8px;font-size:13px;font-weight:bold;display:none;z-index:9999;max-width:300px}
.toast.e{background:#A32D2D}
/* LINKS */
.ql a{font-size:11px;padding:2px 7px;border-radius:4px;background:#e6f1fb;color:#185FA5;text-decoration:none;margin-right:4px}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">🏢</div>
    <h1>Pinnacle Holdings Group</h1>
    <p class="login-sub">Call Assistant — Acceso seguro</p>
    <div id="mode-server">
      <div class="login-field"><label>Email</label>
        <input type="email" id="login-email" placeholder="tu@email.com" onkeydown="if(event.key==='Enter')doLogin()"/>
      </div>
      <div class="login-field"><label>Password</label>
        <input type="password" id="login-pass" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()"/>
      </div>
    </div>
    <div id="mode-local" style="display:none">
      <div class="test-badge">⚗️ <strong>Modo prueba local</strong></div>
      <div class="login-field"><label>Airtable Token</label>
        <input type="password" id="login-tok" placeholder="pat_..." onkeydown="if(event.key==='Enter')doLogin()"/>
      </div>
    </div>
    <button class="login-btn" id="login-btn" onclick="doLogin()">Entrar →</button>
    <div class="login-error" id="login-error"></div>
    <p class="login-note">Sesión activa por 12 horas. Acceso desde cualquier dispositivo.</p>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="topbar">
    <h1>PINNACLE HOLDINGS GROUP — Call Assistant</h1>
    <div class="t-right">
      <span id="clk" style="font-size:11px;opacity:0.8"></span>
      <span class="t-user" id="u-name"></span>
      <button class="t-logout" onclick="doLogout()">Salir</button>
    </div>
  </div>
  <div class="searchbar">
    <input type="text" id="srch" placeholder="Search seller by name..." oninput="doSearch()"/>
    <button class="btn-g" onclick="doSearch()">Search</button>
    <button class="btn-x" onclick="clearAll()">Clear</button>
  </div>
  <div id="cdd"></div>
  <div class="body-grid">
    <div class="left">
      <div class="pt">Seller & Property Info</div>
      <div id="ip"><div class="em">Search for a seller to begin.</div></div>
    </div>
    <div class="right">
      <div class="steps-bar" id="steps-bar" style="display:none"></div>
      <div class="step-content" id="rp">
        <div class="em" style="margin-top:80px">Select a seller to start the call flow.</div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="tst"></div>

<script>
const BASE = 'appfQbDA750Oihy9J';
const AUTH_URL = 'auth.php';
const IS_LOCAL = location.protocol === 'file:';
let TOK='', contacts=[], cur=null, leadF=null, leadRecId=null;
let stype='', stepIdx=0, answers={}, stepHistory=[];
let steps=[], currentUser='';

// ── LOGIN ─────────────────────────────────────────────────────
window.onload = async () => {
  if (IS_LOCAL) {
    document.getElementById('mode-server').style.display='none';
    document.getElementById('mode-local').style.display='block';
    return;
  }
  const s = sessionStorage.getItem('pnk_session');
  if (s) {
    try {
      const r = await fetch(AUTH_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'verify',token:s})});
      const d = await r.json();
      if (d.valid){TOK=d.at;currentUser=d.name;boot();return;}
    } catch(e){}
    sessionStorage.clear();
  }
};

async function doLogin(){
  const btn=document.getElementById('login-btn'),err=document.getElementById('login-error');
  err.style.display='none'; btn.disabled=true; btn.textContent='Verificando...';
  if(IS_LOCAL){
    const tok=document.getElementById('login-tok').value.trim();
    if(!tok){showLoginError('Ingresa tu Airtable Token.');btn.disabled=false;btn.textContent='Entrar →';return;}
    TOK=tok;currentUser='Jorge (local)';boot();return;
  }
  const email=document.getElementById('login-email').value.trim();
  const pass=document.getElementById('login-pass').value;
  if(!email||!pass){showLoginError('Ingresa email y password.');btn.disabled=false;btn.textContent='Entrar →';return;}
  try{
    const r=await fetch(AUTH_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'login',email,password:pass})});
    const d=await r.json();
    if(!r.ok||!d.success)throw new Error(d.error||'Credenciales incorrectas');
    TOK=d.at;currentUser=d.name;sessionStorage.setItem('pnk_session',d.sessionToken);boot();
  }catch(e){showLoginError(e.message);btn.disabled=false;btn.textContent='Entrar →';}
}

function showLoginError(msg){const e=document.getElementById('login-error');e.textContent=msg;e.style.display='block';}

async function doLogout(){
  if(!IS_LOCAL){try{await fetch(AUTH_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'logout',token:sessionStorage.getItem('pnk_session')})});}catch(e){}}
  sessionStorage.clear();location.reload();
}

function boot(){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').style.display='flex';
  document.getElementById('u-name').textContent='👤 '+currentUser;
  loadC();
  setInterval(()=>{
    const n=new Date();
    document.getElementById('clk').textContent=n.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})+' '+n.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
  },1000);
}

// ── API ───────────────────────────────────────────────────────
async function req(path,method='GET',body=null){
  const o={headers:{'Authorization':`Bearer ${TOK}`,'Content-Type':'application/json'}};
  if(method!=='GET'){o.method=method;if(body)o.body=JSON.stringify(body);}
  const r=await fetch(`https://api.airtable.com/v0/${BASE}/${path}`,o);
  if(!r.ok)throw new Error(await r.text());
  return r.json();
}

async function loadC(){
  try{
    let all=[],off='';
    do{const d=await req('Contacts'+(off?`?offset=${off}`:''));all=all.concat(d.records);off=d.offset||'';}while(off);
    contacts=all;
    toast(`✓ ${contacts.length} contacts loaded`);
  }catch(e){toast('Error: '+e.message,true);}
}

// ── HELPERS ───────────────────────────────────────────────────
function sf(v){
  if(v===null||v===undefined||v==='')return '<span style="color:#b4b2a9">—</span>';
  if(Array.isArray(v))return v.join(', ');
  if(typeof v==='boolean')return v?'Yes':'No';
  return String(v);
}
function sc(v){return v?'$'+Number(v).toLocaleString():'<span style="color:#b4b2a9">—</span>';}
function ga(f,k){const v=f[k];return Array.isArray(v)?v.join(', '):(v||'');}
function fullAddr(l){
  if(!l)return'';
  const p=[l['Address'],l['City'],l['Estate']].filter(Boolean);
  return p.join(', ');
}

// ── SESSION MEMORY ────────────────────────────────────────────
function saveSession(){
  if(!cur||!steps.length)return;
  const data={contactId:cur.id,name:cur.fields['Full Name'],stype,stepId:steps[stepIdx]?.id,answers,stepHistory};
  localStorage.setItem(`pnk_call_${cur.id}`,JSON.stringify(data));
}
function loadSaved(id){try{const s=localStorage.getItem(`pnk_call_${id}`);return s?JSON.parse(s):null;}catch(e){return null;}}
function clearSaved(id){localStorage.removeItem(`pnk_call_${id}`);}

// ── SEARCH & PICK ─────────────────────────────────────────────
function doSearch(){
  const q=(document.getElementById('srch').value||'').toLowerCase().trim();
  const dd=document.getElementById('cdd');
  if(!q){dd.style.display='none';return;}
  const res=contacts.filter(r=>String(r.fields['Full Name']||'').toLowerCase().includes(q)).slice(0,8);
  dd.innerHTML=res.length?res.map(r=>`<div class="ci" onclick="pick('${r.id}')"><div><div class="cn">${r.fields['Full Name']||'Unknown'}</div><div class="cm">${r.fields['Phone1']||'—'} | ${r.fields['Stage']||'New'}</div></div><span class="stg">${r.fields['Stage']||'New'}</span></div>`).join(''):'<div class="ci"><div class="cm">No results</div></div>';
  dd.style.display='block';
}

async function pick(id){
  document.getElementById('cdd').style.display='none';
  cur=contacts.find(r=>r.id===id);if(!cur)return;
  leadF=null;leadRecId=null;
  try{
    const lnk=cur.fields['Property Address'];
    if(lnk&&lnk.length){leadRecId=lnk[0];const d=await req(`Leads/${leadRecId}`);leadF=d.fields;}
  }catch(e){}
  renderLeft();
  const saved=loadSaved(cur.id);
  if(saved&&saved.stepId&&saved.stepId!=='final_save'){showResumePrompt(saved);}
  else{startFlow();}
}

function clearAll(){
  cur=null;leadF=null;leadRecId=null;stype='';steps=[];stepIdx=0;answers={};stepHistory=[];
  document.getElementById('srch').value='';
  document.getElementById('cdd').style.display='none';
  document.getElementById('ip').innerHTML='<div class="em">Search for a seller to begin.</div>';
  document.getElementById('steps-bar').style.display='none';
  document.getElementById('rp').innerHTML='<div class="em" style="margin-top:80px">Select a seller to start the call flow.</div>';
}

// ── RESUME ────────────────────────────────────────────────────
function showResumePrompt(saved){
  document.getElementById('steps-bar').style.display='none';
  document.getElementById('rp').innerHTML=`
    <div class="resume-card">
      <h3>📞 Call In Progress</h3>
      <p>You have a saved call with <strong>${saved.name}</strong>.<br>Resume where you left off?</p>
      <div class="resume-btns">
        <button class="btn-resume" onclick="resumeSession()">▶ Resume Call</button>
        <button class="btn-restart-sm" onclick="startFlow()">↺ Start Over</button>
      </div>
    </div>`;
}

function resumeSession(){
  const saved=loadSaved(cur.id);if(!saved)return startFlow();
  stype=saved.stype||'';answers=saved.answers||{};stepHistory=saved.stepHistory||[];
  buildSteps();
  const idx=steps._map[saved.stepId];
  if(idx!==undefined){stepIdx=idx;renderStep();}else startFlow();
}

// ── STEPS BAR ─────────────────────────────────────────────────
function renderStepsBar(){
  const bar=document.getElementById('steps-bar');
  if(!steps.length){bar.style.display='none';return;}
  bar.style.display='flex';
  const mainSteps=steps.filter(s=>!['not_interested','callback_time','asking_followup'].includes(s.id));
  bar.innerHTML=mainSteps.map((s,i)=>{
    const globalIdx=steps._map[s.id];
    let cls='pending';
    if(globalIdx===stepIdx)cls='active';
    else if(stepHistory.includes(s.id))cls='done';
    if(s.internal)cls+=' internal';
    const label=s.label+(answers[s.key]!==undefined&&globalIdx!==stepIdx?` ✓`:'');
    return `<div class="step-tab ${cls}" onclick="jumpToStep('${s.id}')" title="${s.label}">${label}</div>`;
  }).join('');
  // Scroll active tab into view
  setTimeout(()=>{const active=bar.querySelector('.step-tab.active');if(active)active.scrollIntoView({inline:'center',behavior:'smooth'});},100);
}

function jumpToStep(id){
  if(stepHistory.includes(id)){
    const idx=steps._map[id];
    if(idx!==undefined){stepIdx=idx;renderStep();}
  }
}

// ── RENDER STEP ───────────────────────────────────────────────
function renderStep(){
  const step=steps[stepIdx];
  if(!step)return;
  saveSession();
  renderStepsBar();

  let scriptHtml=step.script||'';
  scriptHtml=scriptHtml.replace(/{RATING}/g,answers['Condition Rating']||'?');
  const _ap=answers['asking_price']; scriptHtml=scriptHtml.replace(/{ASKING_PRICE}/g,(_ap!==undefined&&_ap!=='')?'$'+Number(_ap).toLocaleString():'[amount not yet captured]');
  const _lp=answers['realtor_math_response']||answers['lowest_price']||answers['asking_price'];
  scriptHtml=scriptHtml.replace(/{LAST_PRICE}/g,_lp?'$'+Number(_lp).toLocaleString():'[last price]');

  const rp=document.getElementById('rp');
  rp.innerHTML=''; // Clear — only show current step

  // Build current step HTML
  let html='';
  if(scriptHtml) html+=scriptHtml;

  // Input section
  html+=`<div class="input-card">`;

// ── NAVIGATION ────────────────────────────────────────────────
function goToStep(id){
  const idx=steps._map[id];
  if(idx!==undefined){
    stepIdx=idx;
    if(!stepHistory.includes(id))stepHistory.push(id);
    saveSession();renderStep();
  }
}

function goBack(){
  if(stepHistory.length<2)return;
  stepHistory.pop();
  const prevId=stepHistory[stepHistory.length-1];
  const idx=steps._map[prevId];
  if(idx!==undefined){stepIdx=idx;renderStep();}
}

// ── ANSWER FUNCTIONS ──────────────────────────────────────────
function answerChoice(value,nextId,question,key){
  if(key)answers[key]=value;
  goToStep(nextId);
}

function answerText(nextId,question,key,isNumber=false){
  const inp=document.getElementById('flow-inp');
  const val=inp?inp.value.trim():'';
  if(!val){inp&&inp.focus();return;}
  if(key)answers[key]=isNumber?Number(val):val;
  goToStep(nextId);
}

function skipStep(nextId,question){goToStep(nextId);}

function answerRating(n,nextId,question,key){
  if(key)answers[key]=n;
  goToStep(nextId);
}

function answerConfirm(correct,nextId,question,key){
  if(correct){answers[key]=true;goToStep(nextId);}
}

function answerConfirmValueEnc(nextId,question,key,encodedVal,isCorrect,isContact){
  const originalValue=decodeURIComponent(encodedVal);
  answerConfirmValue(nextId,question,key,originalValue,isCorrect,isContact);
}

function answerConfirmValue(nextId,question,key,originalValue,isCorrect,isContact){
  if(isCorrect){
    answers[key]=originalValue;
  }else{
    const inp=document.getElementById('cv-input');
    const val=inp?inp.value.trim():'';
    if(!val){inp&&inp.focus();return;}
    answers[key]=isNaN(Number(val))?val:Number(val);
    if(!answers['_corrections'])answers['_corrections']=[];
    answers['_corrections'].push({field:key,original:originalValue,corrected:answers[key],isContact});
  }
  goToStep(nextId);
}

function answerAddressEdit(nextId,question,key){
  const val=document.getElementById('addr-input').value.trim();
  if(!val)return;
  answers[key]=val;
  goToStep(nextId);
}

function answerAppointment(){
  const date=document.getElementById('appt-date').value;
  const time=document.getElementById('appt-time').value||'18:00';
  if(!date){toast('Select a date for the appointment',true);return;}
  const dateObj=new Date(date+'T'+time);
  const display=dateObj.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'})+' at '+dateObj.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
  answers['appointment_date']=date;
  answers['appointment_time']=time;
  answers['appointment_display']=display;

  const sellerName=cur.fields['Full Name'];
  const sellerPhone=answers['Phone1']||cur.fields['Phone1']||'';
  const sellerEmail=answers['Email1']||cur.fields['Email1']||'';
  const loc=leadF?fullAddr(leadF):'';

  // 1. Google Calendar — create event directly via API (server) or URL (local)
  const start=date+'T'+time+':00';
  const endHour=String((parseInt(time.split(':')[0])+1)).padStart(2,'0');
  const endTime=date+'T'+endHour+':'+time.split(':')[1]+':00';
  const title=`Property Visit — ${sellerName}`;
  const desc=`Property visit scheduled by Pinnacle Holdings Group.\nContact: Jorge | (920) 777-9886 | deals@pinnaclegroupwi.com`;

  if (!IS_LOCAL) {
    // Server mode: create event via calendar.php (Google Calendar API)
    fetch('calendar.php', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        title, location: loc, description: desc,
        start, end: endTime,
        timezone: 'America/Chicago',
        attendeeEmail: sellerEmail || null,
        reminders: [1440, 120] // 24h + 2h in minutes
      })
    }).then(r=>r.json()).then(d=>{
      if(d.success) toast('📅 Event created in Google Calendar!');
      else toast('Calendar: '+d.error, true);
    }).catch(()=>toast('Calendar error', true));
  } else {
    // Local mode: open Google Calendar URL as fallback
    const gcalUrl=`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(title)}&dates=${date.replace(/-/g,'')}T${time.replace(':','')}00/${date.replace(/-/g,'')}T${endHour}${time.split(':')[1]}00&location=${encodeURIComponent(loc)}&details=${encodeURIComponent(desc)}`;
    toast('📅 Opening Google Calendar...');
    setTimeout(()=>window.open(gcalUrl,'_blank'),400);
  }

  // SMS confirmación manejada por Make.com

  // 3. Email confirmation to seller (from deals@pinnaclegroupwi.com)
  if(!IS_LOCAL && sellerEmail){
    fetch('send_notification.php',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        type:'email',
        to:sellerEmail,
        subject:`Appointment Confirmation — Pinnacle Holdings Group`,
        body:`Hi ${sellerName.split(' ')[0]},\n\nThis is Jorge with Pinnacle Holdings Group. I wanted to confirm our upcoming appointment:\n\n📍 Property: ${loc}\n📅 Date & Time: ${display}\n\nI look forward to meeting you and discussing how I can help. If you need to reschedule or have any questions, please don't hesitate to reach out.\n\n📞 (920) 777-9886\n📧 deals@pinnaclegroupwi.com\n\nBest regards,\nJorge\nPinnacle Holdings Group`
      })
    }).then(()=>toast('📧 Email sent to seller')).catch(()=>{});
  }

  if(!IS_LOCAL) fetch('https://hook.us2.make.com/6yvqdj9wgalsvrxsigytmvb5sg5ummdr',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:cur.id,name:sellerName,phone:String(answers['Phone1']||cur.fields['Phone1']||''),address:loc,appointment:display})}).catch(()=>{});
  if(IS_LOCAL) toast('✓ Appointment saved! (SMS & email will send on server)');
  goToStep('final_save');
}

async function saveAll(){
  if(!cur)return toast('No seller selected.',true);
  const btn=document.getElementById('svbtn');
  btn.disabled=true;btn.textContent='Saving...';
  try{
    const today=new Date().toISOString().split('T')[0];
    const a=answers;

    // 1. Contact fields
    const cf={'Last contact date':today};
    const fmap={
      'Foundation':'Foundation','Roof Status':'Roof Status','HVAC Status':'HVAC Status',
      'Occupied Status':'Occupied Status','Condition Rating':'Condition Rating',
      'Monthly Rent':'Monthly Rent','Lease Type':'Lease Type',
      'Best time to call':'Best time to call','Lenguage':'Lenguage',
      'Preferred contact method':'Preferred contact method',
    };
    Object.keys(fmap).forEach(k=>{if(a[k]!==undefined)cf[fmap[k]]=a[k];});
    if(a['appointment_date'])cf['Next follow up date']=a['appointment_date'];
    if(a['lease_exp_notes']){const ld=new Date(a['lease_exp_notes']);if(!isNaN(ld.getTime()))cf['Lease Exp Date']=ld.toISOString().split('T')[0];}

    // Apply contact corrections
    if(a['_corrections']){
      a['_corrections'].filter(c=>c.isContact).forEach(c=>{cf[c.field]=c.corrected;});
    }
    // Direct contact field updates — Phone must be Number (Airtable Number field + Make.com workflow)
    if(a['Phone1']&&a['Phone1']!==cur.fields['Phone1'])cf['Phone1']=Number(String(a['Phone1']).replace(/\D/g,''));
    if(a['Phone2']&&a['Phone2']!==cur.fields['Phone2'])cf['Phone2']=Number(String(a['Phone2']).replace(/\D/g,''));
    if(a['Email1']&&a['Email1']!==cur.fields['Email1'])cf['Email1']=a['Email1'];
    if(a['Email2']&&a['Email2']!==cur.fields['Email2'])cf['Email2']=a['Email2'];

    const stage=document.getElementById('sv-stage')?.value;
    const autoStage=stage||(a['appointment_date']?'Contacted':'Contacted');
    if(autoStage)cf['Stage']=autoStage;

    // Email Sent flag
    if(a['appointment_date']&&(answers['Email1']||cur.fields['Email1']))cf['Email Sent']=true;

    // Build notes
    const nl=[];
    nl.push(`[${today}] Call Summary:`);
    if(a['Foundation'])nl.push(`Foundation: ${a['Foundation']}`);
    if(a['Roof Status'])nl.push(`Roof: ${a['Roof Status']}`);
    if(a['hvac_central'])nl.push(`Central AC: ${a['hvac_central']}`);
    if(a['HVAC Status'])nl.push(`HVAC: ${a['HVAC Status']}`);
    if(a['furnace_age'])nl.push(`Furnace: ${a['furnace_age']}`);
    if(a['water_heater_age'])nl.push(`Water heater: ${a['water_heater_age']}`);
    if(a['Condition Rating'])nl.push(`Condition: ${a['Condition Rating']}/10`);
    if(a['repair_estimate'])nl.push(`Repair est: $${Number(a['repair_estimate']).toLocaleString()}`);
    if(a['Occupied Status'])nl.push(`Occupied: ${a['Occupied Status']}`);
    if(a['Monthly Rent'])nl.push(`Rent: $${Number(a['Monthly Rent']).toLocaleString()}/mo`);
    if(a['amount_owed'])nl.push(`Owed: $${Number(a['amount_owed']).toLocaleString()}`);
    if(a['asking_price'])nl.push(`Asking: $${Number(a['asking_price']).toLocaleString()}`);
    if(a['lowest_price'])nl.push(`Lowest: $${Number(a['lowest_price']).toLocaleString()}`);
    if(a['realtor_math_response'])nl.push(`After realtor math: $${Number(a['realtor_math_response']).toLocaleString()}`);
    if(a['final_price'])nl.push(`Final/bottom line: $${Number(a['final_price']).toLocaleString()}`);
    if(a['Reason for Selling'])nl.push(`Reason: ${a['Reason for Selling']}`);
    if(a['Legal Situation'])nl.push(`Timeline: ${a['Legal Situation']}`);
    if(a['appointment_display'])nl.push(`Appointment: ${a['appointment_display']}`);
    if(a['_corrections']?.length)nl.push(`Updates: ${a['_corrections'].map(c=>`${c.field}: ${c.original}→${c.corrected}`).join(', ')}`);

    if(extra)nl.push(`Notes: ${extra}`);

    // 1. Save Contacts
    try {
      await req(`Contacts/${cur.id}`,'PATCH',{fields:cf});
      console.log('✓ Contacts saved');
    } catch(e) {
      toast('❌ Contacts error: '+e.message, true);

        try {
          delete lf['Last Contact Date'];
          await req(`Leads/${leadRecId}`,'PATCH',{fields:lf});
          toast('⚠ Leads: saved without Last Contact Date');
          console.log('✓ Leads saved (without date)');
        } catch(e2) {
          toast('⚠ Leads error: '+e2.message, true);
          console.error('Leads retry error:', e2.message);
        }
      }
    }

    // 3. Create Note
    const notOutcome = a['appointment_date'] ? 'Appointment Scheduled' : 
                       (a['callback'] ? 'Callback' : 'Contacted');
    const notStage = a['appointment_date'] ? 'Appointment Set' : 'Contacted';
    try {
      await req('Notes & Activity','POST',{fields:{
        'Note Title': `Call — ${cur.fields['Full Name']} — ${today}`,
        'Date': today,
        'Contact Name': [cur.id],
        'Stage': notStage,
        'Seller Motivation': a['Reason for Selling']||'',
        'Outcome': notOutcome,
        'Next action': a['appointment_display'] ? `Property visit: ${a['appointment_display']}` : 'Follow up call',
        'Follow up required': !!a['appointment_date'],
        'Call Logs': nl.join('\n'),
      }});
      console.log('✓ Note saved');
    } catch(e) {
      toast('⚠ Note error: '+e.message, true);
      console.error('Note error:', e.message);
    }

    clearSaved(cur.id);
    await loadC();
    toast('✓ Saved to Airtable!');
    btn.textContent='Saved ✓';
    setTimeout(()=>{btn.disabled=false;btn.textContent='Save Call to Airtable';},2500);
  }catch(e){
    toast('Error: '+e.message,true);
    btn.disabled=false;btn.textContent='Save Call to Airtable';
  }
}

function toast(msg,err=false){
  const t=document.getElementById('tst');
  t.textContent=msg;t.className='toast'+(err?' e':'');
  t.style.display='block';
  setTimeout(()=>t.style.display='none',3500);
}
</script>
